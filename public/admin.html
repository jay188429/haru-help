<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>하루상점 고객센터 관리</title>
  <style>
    :root { --bg:#f7f6f3; --card:#fff; --text:#1f1f1f; --muted:#6b6b6b; --line:#e2dfd8; --accent:#2f6f4f; --danger:#c0392b; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#161715; --card:#202220; --text:#ececec; --muted:#9a9a9a; --line:#33362f; --accent:#6fbf8f; --danger:#ff7a6b; }
    }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--text); font-family: system-ui, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; line-height:1.5; }
    main { max-width: 820px; margin: 0 auto; padding: 16px; }
    h1 { font-size: 1.3rem; }
    section { background: var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:16px; }
    h2 { font-size:1rem; margin:0 0 12px; }
    input { width:100%; padding:10px; margin:4px 0 8px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--text); font-size:1rem; }
    button { padding:10px 14px; border:0; border-radius:8px; background:var(--accent); color:#fff; cursor:pointer; margin:2px 4px 2px 0; }
    button.ghost { background:transparent; color:var(--text); border:1px solid var(--line); }
    table { width:100%; border-collapse:collapse; font-size:.9rem; }
    th, td { text-align:left; border-bottom:1px solid var(--line); padding:8px 6px; vertical-align:top; }
    #msg { min-height:1.2em; color:var(--muted); }
    #msg.err { color:var(--danger); }
    #tableWrap { overflow-x:auto; }
  </style>
</head>
<body>
<main>
  <h1>관리 화면</h1>

  <section>
    <h2>로그인</h2>
    <label>이메일<input id="email" type="email" /></label>
    <label>비밀번호<input id="password" type="password" /></label>
    <button id="btnLogin">로그인</button>
    <button id="btnGoogle" class="ghost">Google로 로그인</button>
    <button id="btnLogout" class="ghost">로그아웃</button>
    <div id="who"></div>
  </section>

  <section>
    <h2>담당자 도구</h2>
    <button id="btnNotify" class="ghost">알림 켜기</button>
    <button id="btnStaff" class="ghost">담당자 권한 받기</button>
    <button id="btnKb" class="ghost">안내문 넣기</button>
    <button id="btnShop" class="ghost">연습 상품 넣기</button>
    <div id="kbResult"></div>
    <p><label>안내문 올리기 (.txt)<input id="file" type="file" accept=".txt,text/plain" /></label></p>
    <div id="uploadResult"></div>
  </section>

  <section>
    <h2>상담 티켓</h2>
    <div id="tableWrap">
      <table>
        <thead><tr><th>질문</th><th>넘긴 이유</th><th>상태</th></tr></thead>
        <tbody id="tickets"></tbody>
      </table>
    </div>
  </section>

  <p id="msg"></p>
</main>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-app.js";
  import {
    getAuth, connectAuthEmulator, signInWithEmailAndPassword, signInWithPopup, GoogleAuthProvider,
    signOut, onAuthStateChanged,
  } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-auth.js";
  import {
    getFirestore, connectFirestoreEmulator, collection, query, orderBy, onSnapshot,
  } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-firestore.js";
  import {
    getFunctions, connectFunctionsEmulator, httpsCallable,
  } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-functions.js";
  import {
    getStorage, connectStorageEmulator, ref as storageRef, uploadBytes,
  } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-storage.js";

  // TODO: index.html 과 같은 설정 값으로 바꾼다
  const firebaseConfig = {
    apiKey: "AIzaSyB_wCwXVA8SAMovWZlNjyrFY5l3XA3MJus",
    authDomain: "haru-help-3b683.firebaseapp.com",
    projectId: "haru-help-3b683",
    storageBucket: "haru-help-3b683.firebasestorage.app",
    messagingSenderId: "584710039125",
    appId: "1:584710039125:web:385fcada9a9f0815e9d6dc",
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  const functions = getFunctions(app, "us-central1"); // 함수는 us-central1 에 있다
  const storage = getStorage(app);

  const isLocal = ["localhost", "127.0.0.1"].includes(location.hostname);
  if (isLocal) {
    connectAuthEmulator(auth, "http://127.0.0.1:9099", { disableWarnings: true });
    connectFirestoreEmulator(db, "127.0.0.1", 8080);
    connectFunctionsEmulator(functions, "127.0.0.1", 5001);
    connectStorageEmulator(storage, "127.0.0.1", 9199);
  }

  const $ = (id) => document.getElementById(id);
  const msg = (t, err = false) => { $("msg").textContent = t; $("msg").className = err ? "err" : ""; };
  const showErr = (e) => msg(e.code || e.message || String(e), true);

  $("btnLogin").onclick = () => signInWithEmailAndPassword(auth, $("email").value.trim(), $("password").value).catch(showErr);
  $("btnGoogle").onclick = () => signInWithPopup(auth, new GoogleAuthProvider()).catch(showErr);
  $("btnLogout").onclick = () => signOut(auth);

  // 브라우저 알림 — 열려 있는 관리 화면이 스스로 띄운다(웹 푸시 FCM 이 아니다)
  $("btnNotify").onclick = async () => {
    try {
      const p = await Notification.requestPermission();
      msg(`알림 권한: ${p}`);
    } catch (e) { showErr(e); }
  };

  // 담당자 권한 받기 — 주인 구글 계정으로만 된다. 끝나면 토큰을 새로 받아 티켓을 다시 읽는다
  $("btnStaff").onclick = async () => {
    try {
      await httpsCallable(functions, "grantStaff")();
      await auth.currentUser.getIdToken(true);
      msg("담당자 권한을 받았습니다");
      listenTickets(auth.currentUser);
    } catch (e) { showErr(e); }
  };

  // 안내문 넣기 — buildKb 를 부르고 saved 숫자를 보여 준다
  $("btnKb").onclick = async () => {
    try {
      $("kbResult").textContent = "임베딩 중…";
      const res = await httpsCallable(functions, "buildKb", { timeout: 300000 })();
      $("kbResult").textContent = `안내문 ${res.data.saved}개 넣음`;
    } catch (e) { $("kbResult").textContent = ""; showErr(e); }
  };

  // 연습 상품 · 주문 넣기 — 주문은 입력한 UID(비우면 내 UID)의 것으로 들어간다
  $("btnShop").onclick = async () => {
    try {
      const uid = prompt("내 주문 시험에 쓸 손님 UID (비우면 지금 로그인한 계정)", "") || undefined;
      const res = await httpsCallable(functions, "seedShop")({ uid });
      $("kbResult").textContent = `상품 ${res.data.products}개 · 주문 ${res.data.orders}개 넣음`;
    } catch (e) { showErr(e); }
  };

  // 안내문 파일 올리기 — kb-files/ 아래 · text/plain · .txt
  $("file").onchange = async (ev) => {
    const f = ev.target.files[0];
    if (!f) return;
    try {
      if (!f.name.endsWith(".txt")) throw new Error(".txt 파일만 올립니다");
      await uploadBytes(storageRef(storage, `kb-files/${f.name}`), f, { contentType: "text/plain" });
      $("uploadResult").textContent = `올림: ${f.name}`;
    } catch (e) { $("uploadResult").textContent = ""; showErr(e); }
  };

  // 티켓 표 — createdAt 최신순 · 처음 불러온 목록은 알리지 않고 새로 생긴 티켓만 알린다
  let unsub = null;
  function listenTickets(user) {
    if (unsub) { unsub(); unsub = null; }
    if (!user) { $("tickets").innerHTML = ""; return; }
    let first = true;
    const q = query(collection(db, "tickets"), orderBy("createdAt", "desc"));
    unsub = onSnapshot(q, (snap) => {
      const body = $("tickets");
      body.innerHTML = "";
      snap.forEach((d) => {
        const t = d.data();
        const tr = document.createElement("tr");
        [t.question, t.reason, t.status].forEach((v) => {
          const td = document.createElement("td");
          td.textContent = v ?? "";
          tr.appendChild(td);
        });
        body.appendChild(tr);
      });
      if (!first && "Notification" in window && Notification.permission === "granted") {
        snap.docChanges().forEach((c) => {
          if (c.type === "added") new Notification("새 상담 티켓", { body: c.doc.data().question });
        });
      }
      first = false;
      msg("");
    }, showErr);
  }

  onAuthStateChanged(auth, (user) => {
    $("who").textContent = user ? `로그인: ${user.email || user.displayName}` : "로그아웃 상태";
    listenTickets(user);
  });
</script>
</body>
</html>
