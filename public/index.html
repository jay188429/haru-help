<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>하루상점 고객센터</title>
  <!-- M43: Google 태그(gtag.js) — 측정 ID는 GA4 웹 스트림의 G- 로 시작하는 값으로 바꾼다 -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-2JME6JM67D"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag("js", new Date());
    gtag("config", "G-2JME6JM67D");
  </script>
  <style>
    :root { --bg:#f7f6f3; --card:#fff; --text:#1f1f1f; --muted:#6b6b6b; --line:#e2dfd8; --accent:#2f6f4f; --danger:#c0392b; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#161715; --card:#202220; --text:#ececec; --muted:#9a9a9a; --line:#33362f; --accent:#6fbf8f; --danger:#ff7a6b; }
    }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--text); font-family: system-ui, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; line-height:1.5; }
    main { max-width: 640px; margin: 0 auto; padding: 16px; }
    h1 { font-size: 1.3rem; margin: 8px 0 16px; }
    section { background: var(--card); border:1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
    h2 { font-size: 1rem; margin: 0 0 12px; }
    input { width:100%; padding:10px; margin:4px 0 8px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--text); font-size:1rem; }
    button { padding:10px 14px; border:0; border-radius:8px; background:var(--accent); color:#fff; font-size:.95rem; cursor:pointer; margin:2px 4px 2px 0; }
    button.ghost { background:transparent; color:var(--text); border:1px solid var(--line); }
    button:disabled { opacity:.5; cursor:default; }
    .row { display:flex; gap:8px; flex-wrap:wrap; }
    #status { color: var(--muted); font-size:.85rem; min-height:1.2em; }
    #status.err { color: var(--danger); }
    #who { font-weight:600; }
    .msg { border-top:1px solid var(--line); padding:12px 0; }
    .msg:first-child { border-top:0; }
    .q { font-weight:600; }
    .a { margin-top:6px; white-space:pre-wrap; }
    .a.failed { color: var(--danger); }
    .a.waiting { color: var(--muted); }
    .tools { color: var(--muted); font-size:.8rem; margin-top:4px; }
    .fb { margin-top:6px; font-size:.9rem; }
    #emuBanner { display:none; position:fixed; bottom:0; left:0; right:0; padding:6px; text-align:center; background:#ffd54f; color:#000; font-size:.8rem; }
  </style>
</head>
<body>
<main>
  <h1>하루상점 고객센터</h1>

  <!-- 로그인 화면 -->
  <section id="loginBox">
    <h2>로그인</h2>
    <div id="signupFields">
      <label>이름<input id="name" autocomplete="name" /></label>
    </div>
    <label>이메일<input id="email" type="email" autocomplete="email" /></label>
    <label>비밀번호 (6자 이상)<input id="password" type="password" autocomplete="current-password" /></label>
    <div class="row">
      <button id="btnSignup">가입</button>
      <button id="btnLogin" class="ghost">로그인</button>
      <button id="btnGoogle" class="ghost">Google로 계속하기</button>
    </div>
  </section>

  <section id="meBox" style="display:none">
    <span id="who"></span>
    <button id="btnLogout" class="ghost" style="float:right">로그아웃</button>
  </section>

  <!-- 상담 화면 -->
  <section id="chatBox" style="display:none">
    <h2>상담</h2>
    <div class="row">
      <input id="question" placeholder="궁금한 것을 물어보세요" style="flex:1" />
      <button id="btnSend">보내기</button>
    </div>
    <div id="list"></div>
  </section>

  <p id="status"></p>
</main>
<div id="emuBanner">Running in emulator mode</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-app.js";
  import {
    getAuth, connectAuthEmulator, createUserWithEmailAndPassword, signInWithEmailAndPassword,
    signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged, updateProfile,
  } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-auth.js";
  import {
    getFirestore, connectFirestoreEmulator, doc, getDoc, setDoc, addDoc, collection, query, where,
    orderBy, onSnapshot, serverTimestamp,
  } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-firestore.js";

  // 웹 앱 설정 값 (비밀번호가 아니라 프로젝트 이름표다. 데이터는 보안 규칙이 지킨다)
  const firebaseConfig = {
    apiKey: "AIzaSyB_wCwXVA8SAMovWZlNjyrFY5l3XA3MJus",
    authDomain: "haru-help-3b683.firebaseapp.com",
    projectId: "haru-help-3b683",
    storageBucket: "haru-help-3b683.firebasestorage.app",
    messagingSenderId: "584710039125",
    appId: "1:584710039125:web:385fcada9a9f0815e9d6dc",
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  // 에뮬레이터 연결 — 포트는 firebase.json 의 emulators 와 같게
  const isLocal = ["localhost", "127.0.0.1"].includes(location.hostname);
  if (isLocal) {
    connectAuthEmulator(auth, "http://127.0.0.1:9099", { disableWarnings: true });
    connectFirestoreEmulator(db, "127.0.0.1", 8080);
    document.getElementById("emuBanner").style.display = "block";
  }

  const $ = (id) => document.getElementById(id);
  const status = (text, isErr = false) => { $("status").textContent = text; $("status").className = isErr ? "err" : ""; };
  const showErr = (e) => status(e.code || e.message || String(e), true);

  // 가입 · 로그인 · 로그아웃
  $("btnSignup").onclick = async () => {
    try {
      const name = $("name").value.trim() || "손님";
      const cred = await createUserWithEmailAndPassword(auth, $("email").value.trim(), $("password").value);
      await updateProfile(cred.user, { displayName: name });
      await ensureUserDoc(cred.user, name);
      renderMe(cred.user);
      status("가입했습니다");
    } catch (e) { showErr(e); }
  };
  $("btnLogin").onclick = async () => {
    try { await signInWithEmailAndPassword(auth, $("email").value.trim(), $("password").value); status("로그인했습니다"); }
    catch (e) { showErr(e); }
  };
  $("btnGoogle").onclick = async () => {
    try { await signInWithPopup(auth, new GoogleAuthProvider()); status("Google로 들어왔습니다"); }
    catch (e) { showErr(e); }
  };
  $("btnLogout").onclick = () => signOut(auth);

  // 처음 들어온 사람이면 users/(UID) 문서를 만든다. 이미 있으면 다시 쓰지 않는다(규칙에 고치기 줄이 없다)
  async function ensureUserDoc(user, name) {
    const ref = doc(db, "users", user.uid);
    const snap = await getDoc(ref);
    if (!snap.exists()) await setDoc(ref, { name: name || user.displayName || "손님", role: "customer" });
  }

  function renderMe(user) {
    $("who").textContent = `${user.displayName || "손님"}님 · UID ${user.uid.slice(0, 6)}…`;
  }

  // 상담 목록 — 내 질문만(where) · 시간순(orderBy) · 실시간(onSnapshot)
  let unsubscribe = null;
  onAuthStateChanged(auth, async (user) => {
    if (unsubscribe) { unsubscribe(); unsubscribe = null; }
    $("loginBox").style.display = user ? "none" : "block";
    $("meBox").style.display = user ? "block" : "none";
    $("chatBox").style.display = user ? "block" : "none";
    if (!user) { $("list").innerHTML = ""; return; }
    renderMe(user);
    try { await ensureUserDoc(user, user.displayName); } catch (e) { showErr(e); }
    const q = query(collection(db, "questions"), where("uid", "==", user.uid), orderBy("createdAt"));
    unsubscribe = onSnapshot(q, (snap) => renderList(snap), showErr);
  });

  $("btnSend").onclick = async () => {
    const text = $("question").value.trim();
    const user = auth.currentUser;
    if (!text || !user) return;
    try {
      // answer 칸은 넣지 않는다 — 답은 함수만 쓴다
      await addDoc(collection(db, "questions"), { uid: user.uid, text, status: "waiting", createdAt: serverTimestamp() });
      $("question").value = "";
      status("");
    } catch (e) { showErr(e); }
  };
  $("question").addEventListener("keydown", (e) => { if (e.key === "Enter") $("btnSend").click(); });

  const sentFeedback = new Set(); // 한 번 누른 답은 두 버튼을 잠근다

  function renderList(snap) {
    const list = $("list");
    list.innerHTML = "";
    snap.forEach((d) => {
      const data = d.data();
      const box = document.createElement("div");
      box.className = "msg";

      const q = document.createElement("div");
      q.className = "q";
      q.textContent = data.text;
      box.appendChild(q);

      const a = document.createElement("div");
      a.className = "a " + (data.status || "");
      if (data.status === "failed") a.textContent = "답을 만들지 못했습니다. 잠시 뒤 다시 물어봐 주세요.";
      else if (data.status === "answered" || data.answer) a.textContent = data.answer;
      else a.textContent = "답을 찾는 중입니다…";
      a.classList.toggle("failed", data.status === "failed");
      a.classList.toggle("waiting", !data.answer && data.status !== "failed");
      box.appendChild(a);

      if (Array.isArray(data.tools) && data.tools.length) {
        const t = document.createElement("div");
        t.className = "tools";
        t.textContent = `쓴 도구: ${data.tools.join(", ")}`;
        box.appendChild(t);
      }

      // 답이 달린 질문에만 반응 버튼 — 실패한 답에는 달지 않는다
      if (data.status === "answered" && data.answer) {
        const fb = document.createElement("div");
        fb.className = "fb";
        const done = sentFeedback.has(d.id);
        const mk = (label, value) => {
          const b = document.createElement("button");
          b.className = "ghost";
          b.textContent = label;
          b.disabled = done;
          b.onclick = () => {
            sentFeedback.add(d.id);
            gtag("event", "answer_feedback", {
              feedback: value,
              tool: (data.tools && data.tools[0]) || "none",
              question_id: d.id,
            });
            fb.querySelectorAll("button").forEach((x) => (x.disabled = true));
            fb.appendChild(document.createTextNode(" 고맙습니다"));
          };
          return b;
        };
        fb.appendChild(mk("👍 좋아요", "up"));
        fb.appendChild(mk("👎 별로예요", "down"));
        if (done) fb.appendChild(document.createTextNode(" 고맙습니다"));
        box.appendChild(fb);
      }
      list.appendChild(box);
    });
  }
</script>
</body>
</html>
