name: eval-ci
on: pull_request
jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm ci
        working-directory: functions
      - run: echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" > functions/.secret.local
      - run: npx firebase emulators:exec --only functions,firestore --project demo-haru "node scripts/eval-ci.js"
